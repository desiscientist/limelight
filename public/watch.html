<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Videos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="ph">
  <div class="app tv-page" id="app">
    <div id="wrap">
      <!-- Player, full width under the top bar -->
      <section class="tv-stage">
        <div class="ph-player" id="vp">
          <video id="player" playsinline disablepictureinpicture preload="metadata"></video>
        </div>
      </section>

      <!-- Title block -->
      <section class="tv-detail">
        <div class="tv-info">
          <div class="tv-kicker" id="kicker"></div>
          <h1 class="ph-title" id="title"></h1>
          <p class="ph-desc" id="desc" hidden></p>
          <div class="tv-meta" id="uploaded"></div>
          <div class="ph-buttons">
            <button class="ph-btn round" id="shareBtn" type="button"></button>
            <button class="ph-btn round" id="reportBtn" type="button"></button>
          </div>
        </div>
      </section>
    </div>

    <!-- Rows -->
    <div id="side"></div>
    <label class="ph-autoplay" id="autoplayLabel">
      <span data-t="Autoplay">Autoplay</span>
      <button class="switch" id="autoplaySwitch" type="button" role="switch" data-t-aria="Autoplay next video"></button>
    </label>
    <div id="relatedSection" hidden><div id="related"></div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script src="/i18n.js"></script>
  <script src="/common.js"></script>
  <script src="/player.js"></script>
  <script>
    renderSidebar();
    translatePage();
    const $ = (id) => document.getElementById(id);

    function shareDialog(v, player) {
      const base = location.origin + '/watch?v=' + encodeURIComponent(v.id);
      const now = Math.floor(player.video.currentTime || 0);
      const link = el('input', { type: 'text', readonly: '', class: 'share-link' });
      const atBox = el('input', { type: 'checkbox' });
      const embed = el('textarea', { readonly: '', class: 'share-embed', rows: '3' });
      const url = () => base + (atBox.checked && now ? '&t=' + now : '');
      const social = el('div', { class: 'share-social' });
      function refresh() {
        link.value = url();
        const u = encodeURIComponent(url()), title = encodeURIComponent(v.title);
        const targets = [
          ['WhatsApp', `https://wa.me/?text=${title}%20${u}`, '#25d366'],
          ['X', `https://twitter.com/intent/tweet?url=${u}&text=${title}`, '#000000'],
          ['Facebook', `https://www.facebook.com/sharer/sharer.php?u=${u}`, '#1877f2'],
          ['Reddit', `https://www.reddit.com/submit?url=${u}&title=${title}`, '#ff4500'],
          ['Telegram', `https://t.me/share/url?url=${u}&text=${title}`, '#229ed9'],
        ];
        social.replaceChildren(
          ...targets.map(([name, href, color]) => el('a', { class: 'share-target', href, target: '_blank', rel: 'noopener noreferrer', style: `--c:${color}` },
            el('span', { class: 'share-dot' }, name[0]), name)),
          el('a', { class: 'share-target', href: `mailto:?subject=${title}&body=${u}`, style: '--c:#6b7280' }, el('span', { class: 'share-dot' }, icon('mail')), t('Email')));
        embed.value = `<iframe src="${location.origin}/embed/${encodeURIComponent(v.id)}${atBox.checked && now ? '?t=' + now : ''}" width="640" height="360" frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
      }
      atBox.onchange = refresh;
      refresh();

      const copyBtn = (getText, label) => {
        const b = el('button', { class: 'btn', type: 'button' }, icon('copy'), label);
        b.onclick = async () => {
          b.replaceChildren(icon('copy'), t((await copyText(getText())) ? 'Copied' : 'Copy failed'));
          setTimeout(() => b.replaceChildren(icon('copy'), label), 2000);
        };
        return b;
      };
      const body = el('div', { class: 'share' },
        social,
        el('div', { class: 'share-row' }, link, copyBtn(() => link.value, t('Copy'))),
        ...(now ? [el('label', { class: 'check' }, atBox, t('Start at {time}', { time: formatDuration(now) }))] : []),
        el('h3', { class: 'share-sub' }, icon('code'), t('Embed on a website')),
        embed,
        el('div', { class: 'share-row end' }, copyBtn(() => embed.value, t('Copy embed code'))));
      if (navigator.share) {
        const native = el('button', { class: 'btn secondary', type: 'button' }, icon('share'), t('More options'));
        native.onclick = () => navigator.share({ title: v.title, url: url() }).catch(() => {});
        body.querySelector('.share-row.end').prepend(native);
      }
      openModal(t('Share'), body);
    }

    function reportDialog(v) {
      const reasons = [
        ['broken', t('Video does not play')],
        ['wrong-info', t('Wrong title, description or tags')],
        ['inappropriate', t('Inappropriate content')],
        ['copyright', t('Copyright problem')],
        ['other', t('Something else')],
      ];
      const list = el('div', { class: 'report-reasons' }, ...reasons.map(([value, label], i) =>
        el('label', { class: 'radio' }, Object.assign(el('input', { type: 'radio', name: 'reason', value }), { checked: i === 0 }), label)));
      const msg = el('textarea', { rows: '3', maxlength: '1000', placeholder: t('Add details (optional)') });
      const status = el('p', { class: 'status' });
      const send = el('button', { class: 'btn', type: 'submit' }, t('Send report'));
      const form = el('form', { class: 'report' }, list, msg, status, el('div', { class: 'share-row end' }, send));
      const close = openModal(t('Report a problem'), form);
      form.onsubmit = async (e) => {
        e.preventDefault();
        send.disabled = true;
        const reason = form.querySelector('input[name=reason]:checked').value;
        const res = await fetch(`/api/videos/${encodeURIComponent(v.id)}/report`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reason, message: msg.value }),
        }).catch(() => null);
        if (res && res.ok) { close(); toast(t('Report sent. Thanks for letting us know')); }
        else { send.disabled = false; status.textContent = t('Could not send the report. Please try again later.'); status.classList.add('error'); }
      };
    }

    (async () => {
      const siteName = await applySiteName();
      const params = new URLSearchParams(location.search);
      const id = params.get('v');
      let v;
      try {
        v = await getJSON('/api/videos/' + encodeURIComponent(id));
      } catch {
        $('app').replaceChildren(el('div', { class: 'page' },
          el('p', { class: 'empty' }, t('This video does not exist.') + ' ', el('a', { href: '/', class: 'link' }, t('Go back home')))));
        return;
      }
      document.title = v.title + (siteName ? ' - ' + siteName : '');

      // Other videos, best matches first (shared tags), used for "Up next" and autoplay.
      const allPromise = getJSON('/api/videos').catch(() => []);
      let ranked = [];

      await auth.ready;
      // Start time: ?t= in the link wins, otherwise resume where a signed-in viewer left off.
      const linkTime = Number(params.get('t')) || 0;
      const saved = watchHistory.position(v.id);
      const resumeAt = !linkTime && saved && saved.t >= 3 ? saved.t : 0;

      const player = createPlayer($('vp'), $('player'), {
        v,
        startAt: linkTime || resumeAt,
        onTheater: () => setTheater(!$('wrap').classList.contains('theater')),
        getNext: () => ranked[0],
      });

      function setTheater(on) {
        $('wrap').classList.toggle('theater', on);
        player.setTheater(on);
        store.set('theater', on ? '1' : '0');
      }
      setTheater(store.get('theater') === '1');

      // Autoplay switch next to "Up next" (same setting as in the player menu).
      const sw = $('autoplaySwitch');
      const syncSwitch = (on) => { sw.classList.toggle('on', on); sw.setAttribute('aria-checked', String(on)); };
      sw.onclick = () => player.setAutoplay(!player.autoplay);
      player.onAutoplayChange(syncSwitch);
      syncSwitch(player.autoplay);

      // While the video plays, the top bar steps aside (it comes back on pause or at the end).
      const syncPlaying = () => document.body.classList.toggle('video-playing', !player.video.paused && !player.video.ended);
      // (timeupdate as well, and a check right now: the video may already have started on its own
      // before these listeners were attached, e.g. when the browser allows autoplay.)
      ['play', 'playing', 'pause', 'ended', 'emptied', 'timeupdate'].forEach((ev) => player.video.addEventListener(ev, syncPlaying));
      syncPlaying();

      // Count one view the first time the video starts playing (used for Top 10 and "Most viewed"; not shown here).
      player.video.addEventListener('play', () => {
        fetch(`/api/videos/${encodeURIComponent(v.id)}/view`, { method: 'POST' }).catch(() => {});
      }, { once: true });

      // ---------- Details ----------
      $('title').textContent = v.title;
      // "Sci-fi · Horror · 1950s" above the title (each opens that category), and
      // "1957 · 0:25 · Added 2 weeks ago · HD" under the description.
      $('kicker').replaceChildren(...v.tags.slice(0, 3).flatMap((tg, i) => [
        ...(i ? [el('span', { class: 'sep', 'aria-hidden': 'true' }, '·')] : []),
        el('a', { href: '/?tag=' + encodeURIComponent(tg) }, capitalize(tg))]));
      const top = topHeight(v);
      const quality = top >= 2160 ? '4K' : top >= 720 ? 'HD' : top ? top + 'p' : '';
      $('uploaded').replaceChildren(...metaLine(v), ...(quality ? [el('span', { class: 'dot' }), el('span', { class: 'tv-badge' }, quality)] : []));
      if (v.description) { $('desc').textContent = v.description; $('desc').hidden = false; }

      $('shareBtn').replaceChildren(icon('share'));
      $('shareBtn').setAttribute('aria-label', t('Share'));
      $('shareBtn').title = t('Share');
      $('shareBtn').onclick = () => shareDialog(v, player);
      $('reportBtn').replaceChildren(icon('flag'));
      $('reportBtn').setAttribute('aria-label', t('Report a problem'));
      $('reportBtn').title = t('Report a problem');
      $('reportBtn').onclick = () => reportDialog(v);


      // ---------- Up next + related ----------
      const all = (await allPromise).filter((x) => x.id !== v.id);
      const shared = (x) => x.tags.filter((tg) => v.tags.includes(tg)).length;
      ranked = all.map((x, i) => ({ x, s: shared(x), i })).sort((a, b) => b.s - a.s || a.i - b.i).map((o) => o.x);
      // Two sideways rows, like a title page: what plays next, then more like this.
      if (ranked.length) {
        const up = rail(t('Up Next'), ranked.slice(0, 12).map(tile));
        up.querySelector('.rail-head').append($('autoplayLabel'));
        $('side').replaceChildren(up);
      } else {
        $('autoplayLabel').hidden = true;
      }
      const rest = ranked.slice(12, 36);
      if (rest.length) $('related').replaceChildren(rail(t('More Like This'), rest.map(tile)));
      $('relatedSection').hidden = rest.length === 0;
    })();
  </script>
</body>
</html>
