<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Videos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <!-- Home -->
    <section class="hero" id="hero" hidden>
      <div class="hero-media"><video id="heroVideo" muted loop playsinline disablepictureinpicture></video></div>
      <div class="hero-shade"></div>
      <div class="hero-content">
        <span class="hero-badge"></span>
        <h1 class="hero-title" id="heroTitle"></h1>
        <div class="hero-tags" id="heroTags"></div>
        <p class="hero-desc" id="heroDesc"></p>
        <div class="hero-meta" id="heroMeta"></div>
        <div class="hero-actions">
          <a class="btn-watch" id="heroWatch" href="#"></a>
          <button class="btn-icon" id="heroMute" type="button"></button>
        </div>
      </div>
      <button class="hero-arrow left" id="heroPrev" type="button" aria-label="Previous video" hidden></button>
      <button class="hero-arrow right" id="heroNext" type="button" aria-label="Next video" hidden></button>
      <div class="hero-thumbs" id="heroThumbs"></div>
    </section>
    <div class="rails" id="rails" hidden></div>

    <!-- Search, tag results and rankings -->
    <section class="page" id="searchView" hidden>
      <h1 class="page-title" id="searchTitle"></h1>
      <!-- Typing happens in the search field in the top bar. -->
      <div class="popular" id="popular" hidden></div>

      <div class="filters">
        <label class="filter"><span data-t="Sort by">Sort by</span>
          <select id="sort">
            <option value="relevance" data-t="Best match">Best match</option>
            <option value="newest" data-t="Newest">Newest</option>
            <option value="views" data-t="Most viewed">Most viewed</option>
            <option value="rating" data-t="Top rated">Top rated</option>
            <option value="longest" data-t="Longest">Longest</option>
            <option value="shortest" data-t="Shortest">Shortest</option>
            <option value="oldest" data-t="Oldest">Oldest</option>
          </select>
        </label>
        <label class="filter"><span data-t="Duration">Duration</span>
          <select id="dur">
            <option value="" data-t="Any length">Any length</option>
            <option value="short" data-t="Under 1 minute">Under 1 minute</option>
            <option value="medium" data-t="1 to 5 minutes">1 to 5 minutes</option>
            <option value="long" data-t="5 to 20 minutes">5 to 20 minutes</option>
            <option value="xlong" data-t="Over 20 minutes">Over 20 minutes</option>
          </select>
        </label>
        <label class="filter"><span data-t="Uploaded">Uploaded</span>
          <select id="date">
            <option value="" data-t="Any time">Any time</option>
            <option value="1" data-t="Today">Today</option>
            <option value="7" data-t="This week">This week</option>
            <option value="30" data-t="This month">This month</option>
            <option value="365" data-t="This year">This year</option>
          </select>
        </label>
        <label class="filter-check"><input type="checkbox" id="hd"> <span data-t="HD only">HD only</span></label>
        <button class="filter-reset" id="resetFilters" type="button" data-t="Clear filters" hidden>Clear filters</button>
      </div>

      <div class="chips" id="chips"></div>
      <p class="result-info" id="info"></p>
      <div class="tile-grid" id="results"></div>
      <div class="sentinel" id="sentinel"></div>
      <p class="empty" id="empty" hidden></p>
    </section>

    <p class="empty" id="loadError" hidden data-t="Could not load videos.">Could not load videos.</p>
  </div>

  <script src="/i18n.js"></script>
  <script src="/common.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const view = (params.get('view') === 'search' || params.has('q') || params.has('tag') || params.has('sort')) ? 'search' : 'home';
    renderSidebar();
    translatePage();
    applySiteName();

    // ---------- Home ----------
    async function buildHome(all) {
      if (!all.length) {
        $('rails').hidden = false;
        $('rails').classList.add('no-hero');
        $('rails').replaceChildren(el('p', { class: 'empty' }, 'No videos yet. Check back soon.'));
        return;
      }
      // Banner: the videos you picked on /admin, in your order; otherwise the 5 newest.
      const { ids } = await getJSON('/api/featured').catch(() => ({ ids: [] }));
      const byId = new Map(all.map((v) => [v.id, v]));
      const picked = ids.map((id) => byId.get(id)).filter(Boolean);
      setupHero(picked.length ? picked : all.slice(0, 5), 'Featured');
      await auth.ready; // Continue Watching needs to know who is signed in

      const rows = [];
      const continuing = watchHistory.inProgress(all);
      if (continuing.length) rows.push(rail('Continue Watching', continuing.slice(0, 20).map(tile)));

      rows.push(topTenRow([...all].sort(SORTS.views).slice(0, 10)));
      rows.push(allVideos(all));
      rows.forEach(reveal);
      $('rails').replaceChildren(...rows);
      $('rails').hidden = !$('searchView').hidden; // stay hidden if the visitor already started searching
    }

    // ---------- Top 10: one row, with a big rank number beside each video ----------
    function topTenRow(list) {
      const row = rail('Top 10 Most Viewed', list.map((v, i) =>
        el('div', { class: 'top10-item' }, el('span', { class: 'rank', 'aria-hidden': 'true' }, String(i + 1)), tile(v))));
      row.classList.add('top10');
      return row;
    }

    // Banner depth: background, text and thumbnails drift at different speeds with the mouse and scroll.
    function heroParallax() {
      if (!can3D) return;
      const hero = $('hero');
      let frame = 0, mx = 0, my = 0;
      const apply = () => {
        frame = 0;
        const sy = Math.min(window.scrollY, hero.offsetHeight);
        hero.style.setProperty('--px', mx.toFixed(3));
        hero.style.setProperty('--py', my.toFixed(3));
        hero.style.setProperty('--sy', (sy * 0.35).toFixed(1) + 'px');
        hero.style.setProperty('--fade', Math.max(0, 1 - sy / (hero.offsetHeight * 0.75)).toFixed(3));
      };
      const queue = () => { if (!frame) frame = requestAnimationFrame(apply); };
      hero.addEventListener('pointermove', (e) => {
        const r = hero.getBoundingClientRect();
        mx = (e.clientX - r.left) / r.width - 0.5;
        my = (e.clientY - r.top) / r.height - 0.5;
        queue();
      });
      hero.addEventListener('pointerleave', () => { mx = my = 0; queue(); });
      window.addEventListener('scroll', queue, { passive: true });
    }

    // Every video in a grid, 24 per page, with numbered pages and a Newest / Most viewed switch.
    // The page and order live in the address (?p=2&o=views) so Back and shared links work.
    function allVideos(all) {
      const PER_PAGE = 24;
      const grid = el('div', { class: 'tile-grid' });
      const pager = el('nav', { class: 'pager', 'aria-label': 'Pages' });
      const ink = el('span', { class: 'pager-ink', 'aria-hidden': 'true' }); // lime marker under the current page
      const summary = el('p', { class: 'pager-summary' });
      const seg = el('div', { class: 'seg', role: 'group', 'aria-label': 'Sort videos' });
      const head = el('div', { class: 'rail-head' }, el('h2', {}, 'All Videos'), seg);
      const section = el('section', { class: 'rail home-all', id: 'all-videos' }, head, grid,
        el('div', { class: 'pager-bar' }, summary, el('div', { class: 'pager-wrap' }, pager, ink)));
      const orders = [['newest', 'Newest'], ['views', 'Most viewed']];

      function readState() {
        const p = new URLSearchParams(location.search);
        const order = p.get('o') === 'views' ? 'views' : 'newest';
        const pages = Math.max(1, Math.ceil(all.length / PER_PAGE));
        const page = Math.min(pages, Math.max(1, parseInt(p.get('p'), 10) || 1));
        return { order, page, pages };
      }
      // Bring the list heading to just under the top bar. Measured from the layout,
      // so the sections' entrance tilt can't throw it off.
      function scrollToList(smooth) {
        let y = 0;
        for (let n = head; n; n = n.offsetParent) y += n.offsetTop;
        const bar = document.querySelector('.topbar')?.offsetHeight || 0;
        window.scrollTo({ top: Math.max(0, y - bar - 24), behavior: smooth && !reduceMotion ? 'smooth' : 'instant' });
      }
      function goTo(page, order, scroll) {
        const p = new URLSearchParams();
        if (page > 1) p.set('p', page);
        if (order !== 'newest') p.set('o', order);
        history.pushState(null, '', p.toString() ? '?' + p : '/');
        render(true);
        if (scroll) scrollToList(true);
      }

      // ---------- Shelf slide between pages ----------
      // Next: the current cards slide out to the left and the new ones come in from the right,
      // column by column. Previous is the mirror image. A new sort order just fades through.
      const EASE = 'cubic-bezier(0.22, 1, 0.36, 1)';
      let swapId = 0;
      async function swapGrid(cards, dir) {
        const id = ++swapId;
        grid.getAnimations({ subtree: true }).forEach((a) => a.cancel());
        if (reduceMotion || !grid.children.length) { grid.replaceChildren(...cards); return; }

        // Keep the section's height while the cards change, so nothing below jumps.
        grid.style.minHeight = grid.offsetHeight + 'px';
        const shift = 48 * dir;
        const outgoing = [...grid.children].map((c) => c.animate(
          [{ opacity: 1, transform: 'translateX(0)' }, { opacity: 0, transform: `translateX(${-shift}px)` }],
          { duration: 220, easing: 'cubic-bezier(0.4, 0, 1, 1)', fill: 'forwards' }));
        await Promise.all(outgoing.map((a) => a.finished.catch(() => {})));
        if (id !== swapId) return; // another page was picked meanwhile

        grid.replaceChildren(...cards);
        // Columns enter one after another, starting from the side the cards come from.
        const lefts = [...new Set(cards.map((c) => c.offsetLeft))].sort((a, b) => a - b);
        const last = cards.map((c) => {
          const col = lefts.indexOf(c.offsetLeft);
          const order = dir < 0 ? lefts.length - 1 - col : col;
          const row = Math.round(c.offsetTop / (cards[0].offsetHeight || 1));
          return c.animate(
            [{ opacity: 0, transform: `translateX(${shift * 1.5}px)` }, { opacity: 1, transform: 'translateX(0)' }],
            { duration: 520, delay: order * 55 + Math.min(row, 4) * 25, easing: EASE, fill: 'backwards' });
        });
        await Promise.all(last.map((a) => a.finished.catch(() => {})));
        if (id === swapId) grid.style.minHeight = '';
      }

      // Slides the lime marker to the current page number.
      function placeInk(animate) {
        const cur = pager.querySelector('.pager-btn.current');
        ink.hidden = !cur || pager.hidden;
        if (!cur) return;
        ink.style.transition = animate && !reduceMotion ? '' : 'none';
        // A 100px bar moved and stretched with transform only (smooth on any device).
        ink.style.transform = `translateX(${cur.offsetLeft + 8}px) scaleX(${(cur.offsetWidth - 16) / 100})`;
        if (!animate) requestAnimationFrame(() => { ink.style.transition = ''; });
      }

      // Page numbers with gaps, e.g. 1 … 4 5 6 … 12
      function pageList(page, pages) {
        const keep = new Set([1, pages, page - 1, page, page + 1]);
        if (page <= 3) [2, 3, 4].forEach((n) => keep.add(n));
        if (page >= pages - 2) [pages - 1, pages - 2, pages - 3].forEach((n) => keep.add(n));
        const nums = [...keep].filter((n) => n >= 1 && n <= pages).sort((a, b) => a - b);
        const out = [];
        nums.forEach((n, i) => { if (i && n - nums[i - 1] > 1) out.push('…'); out.push(n); });
        return out;
      }

      let shown = null; // the page and order on screen, to tell Next from Previous
      function render(animate) {
        const { order, page, pages } = readState();
        const dir = !shown || order !== shown.order ? 0 : Math.sign(page - shown.page);
        const changed = !shown || order !== shown.order || page !== shown.page;
        shown = { order, page };
        seg.replaceChildren(...orders.map(([key, label]) => {
          const b = el('button', { type: 'button', class: key === order ? 'active' : '', 'aria-pressed': String(key === order) }, label);
          b.onclick = () => { if (key !== order) goTo(1, key, false); };
          return b;
        }));

        const sorted = [...all].sort(SORTS[order]);
        const from = (page - 1) * PER_PAGE;
        const cards = sorted.slice(from, from + PER_PAGE).map(tile);
        if (animate && changed) swapGrid(cards, dir);
        else grid.replaceChildren(...cards);
        summary.textContent = `Showing ${from + 1}–${Math.min(from + PER_PAGE, all.length)} of ${all.length} videos`;

        const btn = (label, target, opts = {}) => {
          const b = el('button', { type: 'button', class: 'pager-btn' + (opts.cls ? ' ' + opts.cls : ''), ...(opts.attrs || {}) }, label);
          if (opts.disabled) b.disabled = true;
          else b.onclick = () => goTo(target, order, true);
          return b;
        };
        pager.replaceChildren(
          btn('‹ Previous', page - 1, { cls: 'wide', disabled: page === 1, attrs: { 'aria-label': 'Previous page' } }),
          ...pageList(page, pages).map((n) => n === '…'
            ? el('span', { class: 'pager-gap', 'aria-hidden': 'true' }, '…')
            : btn(String(n), n, { cls: n === page ? 'current' : '', attrs: { 'aria-label': 'Page ' + n, ...(n === page ? { 'aria-current': 'page' } : {}) } })),
          btn('Next ›', page + 1, { cls: 'wide', disabled: page === pages, attrs: { 'aria-label': 'Next page' } }));
        pager.hidden = pages === 1;
        requestAnimationFrame(() => placeInk(animate));
      }

      // Back / Forward between pages slides too, and brings the list into view.
      // (We place the scroll ourselves, so the browser shouldn't restore its own on Back.)
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      window.addEventListener('popstate', () => {
        const before = shown && shown.page;
        render(true);
        if (shown.page !== before) scrollToList(true);
      });
      window.addEventListener('resize', () => placeInk(false));
      render(false);
      // Opened from a link to page 2+? Jump straight to the list.
      if (readState().page > 1) requestAnimationFrame(() => scrollToList(false));
      return section;
    }

    function setupHero(list, badge) {
      const PREVIEW_SECONDS = 20; // each banner video loops only its first 20 seconds
      const SWITCH_EVERY_MS = 5000; // time on each banner movie before sliding to the next
      const video = $('heroVideo');
      video.preload = 'metadata';
      let index = 0, timer = null;
      let inView = true;
      // The video sits on a "stage" layer so the whole picture can move in 3D between movies.
      const media = video.parentElement;
      const stage = el('div', { class: 'hero-stage' });
      media.prepend(stage);
      stage.append(video);
      // Load the banner posters up front so the next movie appears the moment it slides in.
      list.forEach((v) => { if (v.poster) new Image().src = v.poster; });
      // The banner only plays while someone can actually see it.
      const active = () => inView && document.visibilityState === 'visible';

      $('heroWatch').replaceChildren(icon('play'), t('Watch Now'));
      document.querySelector('.hero-badge').textContent = badge;

      // One small dot per banner video (the current one is a longer lime bar), plus arrows on the sides.
      const thumbs = list.map((v, i) => {
        const b = el('button', { class: 'hero-thumb', type: 'button', 'aria-label': v.title });
        b.onclick = () => { if (i !== index) show(i, i > index ? 1 : -1); restart(); };
        return b;
      });
      $('heroThumbs').replaceChildren(...(list.length > 1 ? thumbs : []));
      if (list.length > 1) {
        $('heroPrev').replaceChildren(icon('chevL'));
        $('heroNext').replaceChildren(icon('chevR'));
        $('heroPrev').onclick = () => { show((index - 1 + list.length) % list.length, -1); restart(); };
        $('heroNext').onclick = () => { show((index + 1) % list.length, 1); restart(); };
        $('heroPrev').hidden = $('heroNext').hidden = false;
      }

      // ---------- Crossfade between movies ----------
      // The current trailer (or poster clip) dissolves into the next one, which is already playing
      // underneath; the text fades over. No movement.
      const EASE_OUT = 'cubic-bezier(0.22, 1, 0.36, 1)', FADE_MS = 800;
      let ghost = null;
      // A still of the poster clip on screen right now, laid out exactly like the video (cover + its 1.08 zoom).
      function snapshot() {
        if (video.readyState < 2 || !video.videoWidth) return null;
        const w = stage.clientWidth, h = stage.clientHeight;
        const c = el('canvas', { class: 'hero-ghost' });
        c.width = w; c.height = h;
        const s = Math.max(w / video.videoWidth, h / video.videoHeight) * 1.08;
        const dw = video.videoWidth * s, dh = video.videoHeight * s;
        try { c.getContext('2d').drawImage(video, (w - dw) / 2, (h - dh) / 2, dw, dh); } catch { return null; }
        return c;
      }
      const fadeOut = (node) => node.animate([{ opacity: 1 }, { opacity: 0 }], { duration: FADE_MS, easing: 'ease-in-out', fill: 'forwards' }).finished;
      // YouTube shows its own play/pause symbol in the middle of its player when a trailer first appears,
      // and it can't be switched off; it goes away once the player has been drawn on screen for about half
      // a second. So whatever is in front of an arriving trailer first thins to 96% (the trailer behind is
      // then drawn, but not seen), holds while the symbol comes and goes, and only then dissolves.
      // On a real screen YouTube can take 2 to 3 seconds to hide it, so a trailer that appears with nothing
      // in front (page load, a dot click) waits under a near-black cover for that long.
      const HOLD_MS = 700;
      const dissolveAway = (node, hold = HOLD_MS) => node.animate([
        { opacity: 1 }, { opacity: 0.96, offset: 0.04 }, { opacity: 0.96, offset: 0.04 + hold / (hold + FADE_MS + 100) }, { opacity: 0 },
      ], { duration: hold + FADE_MS + 100, easing: 'linear', fill: 'forwards' }).finished;
      function crossfade(out) {
        if (reduceMotion) { out?.finish(); return; }
        ghost?.remove();
        ghost = snapshot();
        if (ghost) {
          const g = ghost;
          g.classList.add('leaving');
          media.append(g);
          fadeOut(g).then(() => g.remove(), () => g.remove());
        }
        if (out) {
          out.wrap.classList.add('leaving');
          // If the next trailer is already playing underneath, hold over it first (see dissolveAway).
          const next = current();
          (next && next.playing ? dissolveAway(out.wrap) : fadeOut(out.wrap)).then(() => out.finish(), () => out.finish());
        }
        // The words fade over, line by line.
        [...document.querySelector('.hero-content').children].forEach((n, k) => n.animate(
          [{ opacity: 0 }, { opacity: 1 }], { duration: 600, delay: 200 + k * 50, easing: 'ease-out', fill: 'backwards' }));
      }

      // ---------- Trailers ----------
      // A movie with a trailer plays a 30-second clip of it (the official YouTube upload, muted unless
      // the sound is on) over its poster, then the banner slides on. Without one: the poster for 5 s.
      // So the trailer is already running when its slide appears, the next movie's trailer starts a
      // few seconds early, hidden. Trailers only ever start by autoplay: telling YouTube's player to
      // play or pause makes it flash a big play/pause symbol in the middle.
      // YouTube's player shows a play/pause button in its middle for about 4 s after playback starts (it
      // can't be turned off). So a trailer is only ever put on screen once it has played CLEAR_S seconds:
      // the next one starts LEAD_S early underneath, and a trailer that starts with nothing in front of it
      // (page load, a dot click) waits under a dark cover until then.
      const TRAILER_CLIP_S = 30, LEAD_S = 9, CLEAR_S = 5, END_PAD_S = 2, TRAILER_WAIT_MS = 6000;
      const playedS = (e) => { try { return e.player.getCurrentTime() - e.startPos; } catch { return 0; } };
      // Uploaded trailer files play in the browser's own player, which shows no controls at all: always clear.
      const isClear = (e) => !!e && e.playing && (e.kind === 'file' || playedS(e) >= CLEAR_S);
      const hasTrailer = (v) => !!v && (!!v.trailerFile || !!v.trailer);
      const players = new Map(); // slide index -> { wrap, player, playing }
      // YouTube pauses every other player from the same address when one starts playing (and shows a
      // pause symbol on it). The current and the early-started next trailer therefore always come from
      // different addresses: youtube.com and youtube-nocookie.com, taking turns.
      const YT_HOSTS = ['https://www.youtube-nocookie.com', 'https://www.youtube.com'];
      let hostTurn = 0;
      let soundOn = false;
      let ytApi = null;
      const loadYouTubeApi = () => ytApi || (ytApi = new Promise((resolve, reject) => {
        if (window.YT && window.YT.Player) return resolve(window.YT);
        const prev = window.onYouTubeIframeAPIReady;
        window.onYouTubeIframeAPIReady = () => { prev?.(); resolve(window.YT); };
        const s = el('script', { src: 'https://www.youtube.com/iframe_api' });
        s.onerror = () => { ytApi = null; reject(new Error('YouTube unavailable')); };
        document.head.append(s);
      }));
      const current = () => players.get(index);

      // Drops slide i's trailer. With keepPlaying, it is handed back still running (stopping a YouTube
      // player that is on screen flashes a pause symbol); call finish() on it once it is out of sight.
      function dispose(i, keepPlaying = false) {
        const p = players.get(i);
        if (!p) return null;
        players.delete(i);
        p.gone = true;
        p.finish = () => {
          if (p.video) { p.video.pause(); p.video.removeAttribute('src'); p.video.load(); }
          try { p.player?.destroy(); } catch {}
          p.wrap.remove();
        };
        if (!keepPlaying) p.finish();
        return p;
      }

      // Starts slide i's trailer (hidden until that slide is on screen). Safe to call twice.
      function prepare(i) {
        const v = list[i];
        if (!hasTrailer(v) || reduceMotion || players.has(i)) return players.get(i) || null;
        const wrap = el('div', { class: 'hero-trailer-wrap', 'aria-hidden': 'true' });
        if (v.trailerFile) {
          // Uploaded trailer: loaded now, started when its slide comes up (see startTrailerFile), played in full.
          const tv = el('video', { muted: '', playsinline: '', preload: 'auto', disablepictureinpicture: '', tabindex: '-1' });
          tv.muted = true;
          tv.src = v.trailerFile.url;
          wrap.append(tv);
          media.append(wrap);
          const entry = { kind: 'file', wrap, video: tv, playing: false, gone: false };
          players.set(i, entry);
          tv.addEventListener('playing', () => {
            if (entry.gone || entry.playing) return;
            entry.playing = true;
            if (i === index) reveal(entry);
          });
          tv.addEventListener('ended', () => { if (!entry.gone && i === index) show((index + 1) % list.length, 1); });
          tv.addEventListener('error', () => { if (!entry.gone) { dispose(i); if (i === index) restart(); } });
          return entry;
        }
        const slot = el('div');
        wrap.append(slot);
        media.append(wrap);
        const entry = { wrap, player: null, playing: false, gone: false };
        players.set(i, entry);
        const start = v.trailer.start || 0;
        loadYouTubeApi().then((YT) => {
          if (entry.gone) return;
          entry.player = new YT.Player(slot, {
            host: YT_HOSTS[hostTurn++ % 2],
            videoId: v.trailer.youtube,
            // controls: 1 on purpose: with controls: 0 YouTube flashes a big play/pause icon in the middle when
            // playback starts. With 1 its title and control bar sit at the player's top and bottom edges,
            // which the banner crops off. cc_load_policy: 0 and unloading 'captions' keep subtitles off.
            playerVars: { autoplay: 1, mute: 1, controls: 1, cc_load_policy: 0, start, end: start + TRAILER_CLIP_S + LEAD_S + END_PAD_S, playsinline: 1,
              rel: 0, modestbranding: 1, iv_load_policy: 3, disablekb: 1, fs: 0, vq: 'hd1080', origin: location.origin },
            events: {
              onReady: (e) => {
                const f = e.target.getIframe();
                f.setAttribute('tabindex', '-1');
                f.setAttribute('title', v.title + ' trailer');
                try { e.target.unloadModule('captions'); } catch {}
              },
              onStateChange: (e) => {
                if (entry.gone) return;
                if (e.data === YT.PlayerState.PLAYING && !entry.playing) {
                  entry.playing = true;
                  try { entry.startPos = e.target.getCurrentTime(); } catch { entry.startPos = start; }
                  if (i === index) reveal(entry);
                } else if (e.data === YT.PlayerState.ENDED && i === index) {
                  show((index + 1) % list.length, 1);
                }
              },
              onError: () => { if (!entry.gone) { dispose(i); if (i === index) restart(); } },
            },
          });
        }, () => { if (!entry.gone) { dispose(i); if (i === index) restart(); } });
        return entry;
      }

      // The current slide's trailer is playing: bring it up. If it has already played CLEAR_S seconds (it was
      // started early under the previous one) it is simply there as the previous one fades. Otherwise it
      // sits under a near-black cover, which lifts once it has played CLEAR_S seconds.
      function reveal(entry, covered = false) {
        if (!covered && !reduceMotion && entry.kind === 'file') {
          entry.wrap.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 400, easing: 'ease-out' });
        } else if (!covered && !reduceMotion) {
          const cover = el('div', { class: 'hero-cover', 'aria-hidden': 'true' });
          cover.style.opacity = '0.96'; // not fully solid, so Chrome keeps drawing the trailer underneath
          media.append(cover);
          const lift = () => {
            if (entry.gone || current() !== entry) return cover.remove();
            if (!isClear(entry)) return setTimeout(lift, 200);
            fadeOut(cover).then(() => cover.remove(), () => cover.remove());
          };
          lift();
        }
        entry.wrap.classList.add('on');
        video.pause();
        // Trailers start muted; only touch the sound when it should be on (changing it makes the other
        // YouTube players on the page flash their controls).
        if (soundOn && entry.player) { try { entry.player.unMute(); } catch {} }
        restart();
      }

      // Milliseconds of the current trailer clip still to play.
      function trailerRemainingMs() {
        const p = current(), v = list[index];
        if (p && p.kind === 'file') {
          const d = p.video.duration || (v.trailerFile && v.trailerFile.duration) || TRAILER_CLIP_S;
          return Math.max(1500, (d - p.video.currentTime) * 1000 - 900);
        }
        try {
          // Slide on while 2 s of the clip are still left, so it never reaches YouTube's end screen.
          const end = (v.trailer.start || 0) + TRAILER_CLIP_S + LEAD_S;
          return Math.max(1500, (end - p.player.getCurrentTime()) * 1000);
        } catch { return TRAILER_CLIP_S * 1000; }
      }

      function startTrailerFile(entry) {
        if (!entry || entry.kind !== 'file' || entry.playing || !active()) return;
        entry.video.muted = !soundOn;
        entry.video.play().catch(() => { entry.video.muted = true; entry.video.play().catch(() => {}); });
      }

      function show(i, dir = 0) {
        const out = i !== index ? dispose(index, true) : null; // the trailer on screen leaves with its picture
        // Any other trailer started early but not needed now is dropped (e.g. after clicking a dot).
        [...players.keys()].forEach((k) => { if (k !== i) dispose(k); });
        index = i;
        const v = list[i];
        const entry = prepare(i);
        startTrailerFile(entry);
        if (dir) crossfade(out);
        else out?.finish();
        if (entry?.playing) reveal(entry, !!out && isClear(entry)); // under the outgoing trailer, once clear
        if (entry) {
          // A movie with a trailer never shows its poster here: the banner stays dark until the trailer is up.
          video.removeAttribute('poster');
          video.removeAttribute('src');
          video.load();
          video.classList.remove('ready');
        } else {
          // No trailer (or motion turned off on this device): the poster clip.
          if (!dir || reduceMotion) video.classList.remove('ready');
          if (v.poster) video.poster = v.poster;
          video.src = heroSrc(v);
          if (active()) video.play().catch(() => {});
        }
        $('heroTitle').textContent = v.title;
        $('heroMeta').replaceChildren(...metaLine(v));
        $('heroDesc').textContent = v.description;
        $('heroDesc').hidden = !v.description;
        $('heroTags').replaceChildren(...v.tags.slice(0, 3).map(capitalize).map((x) => el('span', {}, x)));
        $('heroWatch').href = '/watch?v=' + encodeURIComponent(v.id);
        thumbs.forEach((tb, k) => tb.classList.toggle('active', k === i));
        restart();
      }

      // When to slide on (also while the mouse is over it), and only while the banner can be seen:
      // a playing trailer gets the rest of its clip; one still loading gets a few seconds to start;
      // a movie without a trailer gets 5 s. A few seconds before each slide, the next trailer starts.
      let leadTimer = null;
      function restart() {
        clearTimeout(timer);
        clearTimeout(leadTimer);
        if (list.length < 2 || !active()) return;
        const p = current();
        const waitingForTrailer = !p?.playing && hasTrailer(list[index]) && !reduceMotion;
        const ms = p?.playing ? trailerRemainingMs() : waitingForTrailer ? TRAILER_WAIT_MS : SWITCH_EVERY_MS;
        const next = (index + 1) % list.length;
        // At the change, if the next trailer is still within its first CLEAR_S seconds, wait a little for it.
        let waited = 0;
        const go = () => {
          const e = players.get(next);
          if (e && !e.gone && e.playing && !isClear(e) && waited < 8000) { waited += 200; timer = setTimeout(go, 200); return; }
          show(next, 1);
        };
        timer = setTimeout(go, ms);
        // Start the next trailer early only once it is known when this slide ends (not while this
        // slide's own trailer is still loading, or the next one would start far too soon).
        if (!waitingForTrailer) leadTimer = setTimeout(() => prepare(next), Math.max(0, ms - LEAD_S * 1000));
      }
      // Out of sight (scrolled away, tab hidden): stop everything. Trailers are dropped rather than
      // paused (pausing makes YouTube show its play/pause symbol); the current one starts again when
      // the banner is back in view.
      function syncPlayback() {
        if (active()) {
          if (!current()) prepare(index);
          startTrailerFile(current());
          if (!current()?.playing) video.play().catch(() => {});
          restart();
        } else {
          video.pause();
          clearTimeout(timer);
          clearTimeout(leadTimer);
          [...players.keys()].forEach((k) => dispose(k));
        }
      }

      // Short preview: jump back to the start after 20 seconds.
      video.addEventListener('timeupdate', () => {
        if (video.currentTime >= PREVIEW_SECONDS) video.currentTime = 0;
      });
      video.addEventListener('loadeddata', () => video.classList.add('ready'));

      // Pause when scrolled out of view, or when the tab is hidden / minimised.
      new IntersectionObserver((entries) => {
        inView = entries[0].isIntersecting;
        syncPlayback();
      }, { threshold: 0.25 }).observe($('hero'));
      document.addEventListener('visibilitychange', syncPlayback);

      const mute = $('heroMute');
      // One sound switch for both the poster clip and the trailer (starts muted).
      const syncMute = () => {
        mute.replaceChildren(icon(soundOn ? 'volOn' : 'volOff'));
        mute.setAttribute('aria-label', t(soundOn ? 'Mute' : 'Unmute'));
      };
      mute.onclick = () => {
        soundOn = !soundOn;
        video.muted = !soundOn;
        try { const p = current(); if (p?.video) p.video.muted = !soundOn; else if (p?.player) soundOn ? p.player.unMute() : p.player.mute(); } catch {}
        syncMute();
      };
      syncMute();

      $('hero').hidden = false;
      heroParallax();
      show(0);
      restart();
    }

    // ---------- Search ----------
    const PAGE_SIZE = 30;
    const DURATIONS = { short: [0, 60], medium: [60, 300], long: [300, 1200], xlong: [1200, Infinity] };

    function buildSearch(all) {
      $('searchView').hidden = false;
      // The search field in the top bar drives this page; its suggestions open right under it.
      const field = document.querySelector('.top-find');
      field.dataset.live = '1';
      const input = field.querySelector('input');
      input.id = 'search';
      Object.entries({ role: 'combobox', 'aria-autocomplete': 'list', 'aria-controls': 'suggest', 'aria-expanded': 'false' })
        .forEach(([k, val]) => input.setAttribute(k, val));
      field.append(el('ul', { class: 'suggest', id: 'suggest', role: 'listbox', hidden: '' }));
      const state = {
        q: params.get('q') || '',
        tag: params.get('tag') || '',
        sort: params.get('sort') || '',
        dur: params.get('dur') || '',
        date: params.get('date') || '',
        hd: params.get('hd') === '1',
      };
      if (!input.value) input.value = state.q;
      field.sync();
      $('dur').value = state.dur; $('date').value = state.date; $('hd').checked = state.hd;

      // Typed searches match movie titles only: every word you type has to start a word in the
      // title ("gen" finds The General, "eral" doesn't). Accents and punctuation are ignored.
      // (#tag still finds a tag, for links that use it.)
      const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
      const splitWords = (s) => norm(s).split(/[^a-z0-9]+/).filter(Boolean);
      const titleWordsCache = new Map();
      const titleWords = (v) => {
        if (!titleWordsCache.has(v.id)) titleWordsCache.set(v.id, splitWords(v.title));
        return titleWordsCache.get(v.id);
      };
      function titleMatches(v, words) {
        const tw = titleWords(v);
        return words.every((w) => (w.startsWith('#') ? v.tags.includes(w.slice(1)) : tw.some((x) => x.startsWith(w))));
      }
      function queryWords(q) {
        return q.split(/\s+/).filter(Boolean).flatMap((w) => (w.startsWith('#') ? [w] : splitWords(w)));
      }
      // Best first: the exact title, then titles that start with what you typed, then whole-word matches.
      function relevance(v, words) {
        const title = splitWords(v.title).join(' '), q = words.filter((w) => !w.startsWith('#')).join(' ');
        if (!q) return 0;
        let s = title === q ? 100 : title.startsWith(q) ? 50 : title.includes(' ' + q) ? 25 : 0;
        for (const w of words) if (titleWords(v).includes(w)) s += 2;
        return s;
      }

      let results = [], shown = 0;
      function update(fromTyping) {
        state.q = input.value.trim().toLowerCase();
        const words = queryWords(state.q);
        const sort = state.sort || (words.length ? 'relevance' : 'newest');
        $('sort').value = sort;

        results = all.filter((v) => {
          if (state.tag && !v.tags.includes(state.tag)) return false;
          if (words.length && !titleMatches(v, words)) return false;
          if (state.dur) {
            const [min, max] = DURATIONS[state.dur];
            if (!(v.duration >= min && v.duration < max)) return false;
          }
          if (state.date && ageDays(v) > Number(state.date)) return false;
          if (state.hd && topHeight(v) < 720) return false;
          return true;
        });
        if (sort === 'relevance' && words.length) {
          results = results.map((v) => ({ v, s: relevance(v, words) })).sort((a, b) => b.s - a.s || SORTS.newest(a.v, b.v)).map((o) => o.v);
        } else {
          results.sort(SORTS[sort] || SORTS.newest);
        }

        // Keep the URL in sync so any view can be shared or bookmarked.
        const p = new URLSearchParams();
        for (const k of ['q', 'tag', 'sort', 'dur', 'date']) if (state[k]) p.set(k, state[k]);
        if (state.hd) p.set('hd', '1');
        if (![...p.keys()].length) p.set('view', 'search');
        history.replaceState(null, '', '?' + p);

        const titles = { views: 'Most Viewed', rating: 'Top Rated' };
        $('searchTitle').textContent = state.tag ? capitalize(state.tag) : (!state.q && titles[state.sort]) || t('Search');
        const filtered = state.dur || state.date || state.hd;
        $('resetFilters').hidden = !filtered;

        renderChips();
        $('results').replaceChildren();
        shown = 0;
        showMore();
        const n = results.length;
        $('info').textContent = t(n === 1 ? '{n} video' : '{n} videos', { n }) +
          (state.tag ? ' · ' + t('in "{tag}"', { tag: state.tag }) : '') +
          (state.q ? ' · ' + t('matching "{q}"', { q: state.q }) : '');
        $('info').hidden = n === 0; // nothing found: just "No results", no "0 videos" line
        $('empty').hidden = n > 0;
        $('empty').textContent = all.length ? 'No results' : t('No videos yet. Check back soon.');
        $('popular').hidden = !!state.q || !popular.length;
        if (fromTyping) scheduleSearchLog();
      }

      // Load results in pages as you scroll.
      function showMore() {
        const next = results.slice(shown, shown + PAGE_SIZE);
        $('results').append(...next.map(tile));
        shown += next.length;
      }
      new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && shown < results.length) showMore();
      }, { rootMargin: '600px' }).observe($('sentinel'));

      function renderChips() {
        $('chips').replaceChildren(...[['', t('All')], ...tagCounts(all).map(([tg]) => [tg, tg])].map(([tg, label]) => {
          const b = el('button', { class: 'chip' + (tg === state.tag ? ' active' : ''), type: 'button' }, label);
          b.onclick = () => { state.tag = tg === state.tag ? '' : tg; update(); };
          return b;
        }));
      }

      $('sort').onchange = () => { state.sort = $('sort').value; update(); };
      $('dur').onchange = () => { state.dur = $('dur').value; update(); };
      $('date').onchange = () => { state.date = $('date').value; update(); };
      $('hd').onchange = () => { state.hd = $('hd').checked; update(); };
      $('resetFilters').onclick = () => {
        state.dur = state.date = ''; state.hd = false;
        $('dur').value = ''; $('date').value = ''; $('hd').checked = false;
        update();
      };

      // ---------- Popular searches ----------
      let popular = [];
      getJSON('/api/searches/popular').then((list) => {
        popular = list;
        $('popular').replaceChildren(el('span', { class: 'popular-label' }, t('Popular searches:')),
          ...list.map((q) => {
            const b = el('button', { class: 'chip small', type: 'button' }, q);
            b.onclick = () => { input.value = q; field.sync(); update(true); };
            return b;
          }));
        $('popular').hidden = !!state.q || !list.length;
      }).catch(() => {});

      // Count a search once the visitor stops typing and it found something.
      let logTimer;
      function scheduleSearchLog() {
        clearTimeout(logTimer);
        logTimer = setTimeout(() => {
          if (state.q.length >= 2 && results.length) {
            fetch('/api/searches', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ q: state.q }) }).catch(() => {});
          }
        }, 2000);
      }

      // ---------- Suggestions while typing ----------
      const box = $('suggest');
      let active = -1, items = [];
      function closeSuggest() { box.hidden = true; input.setAttribute('aria-expanded', 'false'); active = -1; }
      function renderSuggest() {
        // Same rule as the results: movies whose title matches, best first.
        const words = queryWords(input.value.trim().toLowerCase()).filter((w) => !w.startsWith('#'));
        if (!words.length) return closeSuggest();
        items = all.filter((v) => titleMatches(v, words))
          .map((v) => ({ v, s: relevance(v, words) })).sort((a, b) => b.s - a.s || SORTS.newest(a.v, b.v)).slice(0, 6)
          .map(({ v }) => ({ kind: 'video', value: v.id, label: v.title, extra: formatDuration(v.duration) }));
        if (!items.length) return closeSuggest();
        box.replaceChildren(...items.map((it, i) => {
          const li = el('li', { role: 'option', id: 'sg' + i, class: 'suggest-item' + (i === active ? ' active' : '') },
            icon(it.kind === 'tag' ? 'grid' : 'search'), el('span', { class: 'sg-label' }, it.label), el('span', { class: 'sg-extra' }, it.extra));
          li.onmousedown = (e) => { e.preventDefault(); pick(it); };
          return li;
        }));
        box.hidden = false;
        input.setAttribute('aria-expanded', 'true');
      }
      function pick(it) {
        closeSuggest();
        if (it.kind === 'video') { location.href = '/watch?v=' + encodeURIComponent(it.value); return; }
        input.value = '';
        state.tag = it.value;
        update();
      }
      input.addEventListener('input', () => { active = -1; renderSuggest(); update(true); });
      input.addEventListener('keydown', (e) => {
        if (box.hidden) return;
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          active = (active + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
          renderSuggest();
          input.setAttribute('aria-activedescendant', 'sg' + active);
        } else if (e.key === 'Enter' && active >= 0) {
          e.preventDefault();
          pick(items[active]);
        } else if (e.key === 'Escape') {
          closeSuggest();
        }
      });
      input.addEventListener('blur', closeSuggest);

      update();
      if (!state.tag && !state.sort) input.focus();
    }

    // Typing in the top search field on the home page swaps the page for live results straight away
    // (no reload). Back returns to the home page.
    function searchFromHome(all) {
      const input = document.querySelector('.top-find input');
      input.addEventListener('input', function start() {
        input.removeEventListener('input', start);
        history.pushState(null, '', '?view=search');
        $('heroVideo').pause();
        $('hero').hidden = true;
        $('rails').hidden = true;
        window.scrollTo(0, 0);
        buildSearch(all);
        input.dispatchEvent(new Event('input')); // show suggestions for what was typed so far
      });
      window.addEventListener('popstate', () => {
        const p = new URLSearchParams(location.search);
        const isSearch = p.get('view') === 'search' || p.has('q') || p.has('tag') || p.has('sort');
        if (!isSearch && !$('searchView').hidden) location.reload();
      });
    }

    getJSON('/api/videos')
      .then((all) => {
        ({ home: buildHome, search: buildSearch })[view](all);
        if (view === 'home') searchFromHome(all);
      })
      .catch((e) => { console.error(e); $('loadError').hidden = false; });
  </script>
</body>
</html>
